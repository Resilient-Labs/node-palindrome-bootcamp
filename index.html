<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
		<title>PALINDROME CHECK</title>
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<header>
			<nav>
				<h1>PALINDROME CHECK</h1>
			</nav>
			<h3>Check a word reads the same in reverse.</h3>
		</header>
		<main class="container">
			<section class="container-card">
				<h3>Enter a word or phrase:</h3>
				<section class="container-word">
					<input type="text" id="word" name="word"/>
				</section>
				<button class="btn-check-palindrome" id="check-palindrome">CHECK PALINDROME</button>
			</section>
			<section class="container-result">
				<h2 class="result"></h2>
			</section>
		</main>
		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
