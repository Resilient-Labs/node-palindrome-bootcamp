<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="Palindrome" content="User looks up if word is palindrome">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Palindrome Checker</title>
		<!-- external CSS link -->
		 <link rel="stylesheet" href="css/normalize.css">
		 <link rel="stylesheet" href="css/style.css">
	</head>

<body>
		<header>
		<h1>Palindrome Checker</h1>
		<p>Hello! Let's check if your word is a palindrome. A palindrome is a word, phrase, name, or number that reads the same forward or backward e.g Civic or Radar</p>
		</header>
	<section class="container">
		<input class="userInput" placeholder="Type word here e.g civic">
		<button id="button">Submit</button>
		<h2 class="entered-word"></h2>
		<h3 class="reversed-word"></h3>
    	<h4 class="result"><!--Palindrome Yes or No--></h4>
	</section>
	<script type="text/javascript" src="js/main.js"></script>
</body>
</html>
