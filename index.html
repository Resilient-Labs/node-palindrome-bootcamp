<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker Tool</title>
    <link rel="stylesheet" href="/css/style.css">
    

</head>
<body>
    <header> 
       <h1>Palindrome Checker</h1> 
    </header>

    <main class="palindrome-checker">
        <section class="palidrome-info"> 
            <h2>What is a Palindrome?</h2>
            <p>A palindrome is a word that is spelled the same way - forwards and backwards. </p>

            <p>
                With this checker, you can enter a word to check if it is a palindrome. 
                The result will tell you whether  the word is a palindrome or not.
            </p>
        </section>

        <section class="user-input">
            <form>
                <!--User Input-->
                <label for="input">Enter a word:</label>
                <input type="text" id="input" placeholder="">

                <!--Button to Click -->
                <button id="clickButton" type="button">Check Word</button>
            </form>
            
            <div id="result"></div>

        </section>

    </main> 

    
<script type="text/javascript" src="/js/main.js"></script>

</body>
</html>
