<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Palindrome Checker</title>
</head>
<body>
    <header>
        <h1>Palindromic</h1>
    </header>
    <section>
        <h2>Type a word, phrase, or sequence</h2>
    
        <div>
            <input id="randomString" type="text" value="">
            <button id="checkBtn">Check Palindrome</button>
        </div>

        <h3>A palindrome is a word, phrase, or sequence that reads the same backward as forward, e.g., madam or nurses run.</h3>

        <p id="result"></p>
    </section>
    <script type="text/javascript" src="/js/main.js"></script>
</body>
</html>
