<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Palindrome Checker</h1>
    <p>Type a word or phrase. The server will tell you if it reads the same forwards and backwards.</p>

    <form id="checkForm">
      <input type="text" id="wordInput" placeholder="e.g. racecar" maxlength="1000">
      <button type="submit">Check</button>
    </form>

    <p id="result"></p>
  </main>

  <script src="main.js"></script>
</body>
</html>
